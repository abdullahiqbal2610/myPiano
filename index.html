<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Web Piano</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Tone.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Virtual Web Piano 🎹</h1>
            <div class="controls">
                <div class="control-group">
                    <label for="mode-select">Mode:</label>
                    <select id="mode-select">
                        <option value="manual">Manual Play</option>
                        <option value="auto">Auto Play</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="melody-select">Sheet Music:</label>
                    <select id="melody-select">
                        <option value="none">-- Select Melody --</option>
                        <option value="ode_to_joy">Ode to Joy (Beethoven)</option>
                        <option value="twinkle">Twinkle Twinkle Little Star</option>
                        <option value="happy_birthday">Happy Birthday</option>
                        <option value="kal_ho_naa_ho">Kal Ho Naa Ho (Title Track)</option>
                        <option value="star_wars">Star Wars Theme</option>
                        <option value="harry_potter">Harry Potter (Hedwig's Theme)</option>
                        <option value="tum_hi_ho">Tum Hi Ho (Aashiqui 2)</option>
                        <option value="tujh_mein_rab">Tujh Mein Rab Dikhta Hai</option>
                        <option value="pehla_nasha">Pehla Nasha</option>
                        <option value="kuch_kuch_hota_hai">Kuch Kuch Hota Hai</option>
                        <option value="chura_ke_dil_mera">Chura Ke Dil Mera</option>
                        <option value="kabhi_kabhie">Kabhi Kabhie Aditi</option>
                        <option value="dil_diyan_gallan">Dil Diyan Gallan</option>
                        <option value="teri_meri">Teri Meri (Bodyguard)</option>
                        <option value="my_heart_will_go_on">My Heart Will Go On (Titanic)</option>
                        <option value="let_it_be">Let It Be (The Beatles)</option>
                        <option value="hallelujah">Hallelujah</option>
                        <option value="perfect">Perfect (Ed Sheeran)</option>
                        <option value="fur_elise">Für Elise</option>
                        <option value="mary_had_a_little_lamb">Mary Had a Little Lamb</option>
                        <option value="row_boat">Row, Row, Row Your Boat</option>
                        <option value="london_bridge">London Bridge is Falling Down</option>
                        <option value="frere_jacques">Frère Jacques</option>
                        <option value="amazing_grace">Amazing Grace</option>
                        <option value="jingle_bells">Jingle Bells</option>
                        <option value="auld_lang_syne">Auld Lang Syne</option>
                        <option value="brahms_lullaby">Brahms' Lullaby</option>
                        <option value="joy_to_the_world">Joy to the World</option>
                        <option value="oh_susanna">Oh! Susanna</option>
                        <option value="mario_theme">Super Mario Bros Theme</option>
                    </select>
                </div>

                <div class="control-group auto-controls" style="display: none;">
                    <button id="play-btn">Auto-Play ▶</button>
                    <button id="stop-btn">Stop ⏹</button>
                </div>
            </div>
        </header>

        <main>
            <!-- The Piano Keyboard -->
            <div id="piano-container">
                <!-- Piano keys will be generated via JS -->
            </div>

            <!-- The Virtual Computer Keyboard -->
            <div id="computer-keyboard-container">
                <!-- Keyboard UI will be generated via JS -->
            </div>
            
            <!-- Sheet Music Container -->
            <div id="sheet-music-container" style="display: none;">
                <h2>Sheet Music: <span id="current-melody-name"></span></h2>
                <div id="sheet-music-display"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
